<!doctype html><html><head><meta charset="utf-8"><title>Window designs preview</title>
<style id="ff"></style><style>body{margin:0;background:#ddd}.tile{width:1287px;height:1222px;margin:0 0 20px}</style>
<script src="designs.js"></script></head><body><div id="out"></div>
<script>
/* fonts: same files the app ships */
const F={AmiriT:'t/AmiriT',Baloo:'t/Baloo',Bebas:'t/Bebas',Cairo:'t/Cairo',Cinzel:'t/Cinzel',Cormorant:'t/Cormorant',ElMessiri:'t/ElMessiri',Josefin:'t/Josefin',Oswald:'t/Oswald',Playfair:'t/Playfair',PoppinsL:'t/PoppinsL',PoppinsM:'t/PoppinsM',PoppinsSB:'t/PoppinsSB',Quicksand:'t/Quicksand',Rakkas:'t/Rakkas',Ruqaa:'t/Ruqaa',TajawalB:'t/TajawalB'};
document.getElementById('ff').textContent=Object.entries(F).map(([n,f])=>`@font-face{font-family:${n};src:url(../../fonts/${f}.woff)}`).join('');
const P=[['الفجر','Fajr','05:12','AM',312],['الشروق','Sunrise','06:36','AM',396],['الظهر','Dhuhr','11:59','AM',719],['العصر','Asr','02:44','PM',884],['المغرب','Maghrib','05:06','PM',1026],['العشاء','Isha','06:25','PM',1105]];
const d={date:'Tuesday, 17 November 2026',hij:'Jumada II 7, 1448 AH',city:'Erbil',hm:'10:14',sec:'57',ap:'AM',day:'17',wd:'Tuesday',my:'November 2026',wdu:'TUESDAY',
  nxar:'الظهر',nx:'Dhuhr',nt:'11:59',nap:'AM',cd:'1:44:03',pct:'52.0',mt:614,c0:'1',c1:'0',c2:'1',c3:'4',s0:'5',s1:'7'};
P.forEach((x,i)=>{d['p'+i+'a']=x[0];d['p'+i+'e']=x[1];d['p'+i+'h']=x[2];d['p'+i+'m']=x[3];d['m'+i]=x[4];d['on'+i]=i===2?' x-on':'';d['pa'+i]=x[4]<d.mt?' x-past':'';});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const k=(n,u)=>{const v=String(d[n]??'');return `<span data-k="${n}">${esc(u?v.toUpperCase():v)}</span>`;};
const lab=t=>t.toUpperCase();
const css=document.createElement('style');css.textContent=Object.values(NEW_CSS).join('\n');document.head.appendChild(css);
let n=0;document.getElementById('out').innerHTML=Object.keys(NEW_RBX).map(key=>`<div class="tile" id="t-${key}"><div class="rbx rbx-${key}" dir="ltr">${NEW_RBX[key](d,k,lab,'x'+(++n)+'_')}</div></div>`).join('');
</script></body></html>
