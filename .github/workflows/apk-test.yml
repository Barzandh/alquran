# Manual helper: builds the APK (without publishing it), checks its signature for old and new Android,
# runs the "needs a newer Android" code check, then installs and opens it on real Android emulators.
name: APK test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Put the web app inside the APK
        run: |
          W=android/app/src/main/assets/www
          rm -rf "$W"; mkdir -p "$W"
          cp -r index.html data fonts icons manifest.webmanifest "$W/"
      - name: Make the signing key
        run: |
          KEY="alquran-built-in-signing-key-v1"
          echo "ALQURAN_KEY=$KEY" >> "$GITHUB_ENV"
          pip install --quiet cryptography
          ALQURAN_KEY="$KEY" python3 android/sign/derive_key.py "$RUNNER_TEMP/alquran.p12"
          echo "ALQURAN_KEYSTORE=$RUNNER_TEMP/alquran.p12" >> "$GITHUB_ENV"
      - name: Build and check
        env: { VERSION_CODE: '9000', VERSION_NAME: '2.0.test' }
        run: |
          gradle -p android assembleRelease --no-daemon -q 2>&1 | tail -20
          cp android/app/build/outputs/apk/release/app-release.apk AlQuran.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/aapt2 dump badging AlQuran.apk | grep -E "^package|^sdkVersion|^targetSdkVersion" | sed "s/^/CHK /"
          $BT/apksigner verify --verbose --print-certs --min-sdk-version 21 AlQuran.apk 2>&1 | grep -E "Verifie|certificate SHA-256|ERROR|DOES NOT" | sed "s/^/CHK /"
          gradle -p android :app:lintRelease --no-daemon -q 2>&1 | grep -vE "^\s*$" | tail -60 | sed "s/^/LINT /"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: AlQuran.apk }
  device:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 21, arch: x86, target: default }
          - { api: 23, arch: x86, target: default }
          - { api: 35, arch: x86_64, target: google_apis }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p out
            adb install -r AlQuran.apk > out/install.txt 2>&1 || true
            cat out/install.txt
            adb shell am start -n com.barzandh.alquran/.MainActivity || true
            sleep 30
            adb exec-out screencap -p > out/screen.png
            adb shell dumpsys package com.barzandh.alquran | grep -E "versionName|versionCode" > out/app.txt || true
            adb shell dumpsys package com.google.android.webview | grep -m1 versionName >> out/app.txt || true
            adb shell dumpsys package com.android.webview | grep -m1 versionName >> out/app.txt || true
            adb shell dumpsys package com.android.chrome | grep -m1 versionName >> out/app.txt || true
            adb shell pidof com.barzandh.alquran >> out/app.txt || adb shell ps | grep alquran >> out/app.txt || echo "NOT RUNNING" >> out/app.txt
            adb logcat -d | grep -E "FATAL|AndroidRuntime|chromium.*Uncaught|chromium.*SyntaxError" | tail -30 > out/log.txt || true
            cat out/app.txt
      - name: Save results to a branch
        if: always()
        run: |
          cd out 2>/dev/null || { mkdir out && cd out && echo "no results" > install.txt; }
          git init -q -b ci-test-${{ matrix.api }}
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK test on Android API ${{ matrix.api }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-test-${{ matrix.api }}
